.s{position:absolute;font-size:clamp(14px,4vw,22px);animation:tw 2.4s ease-in-out infinite;opacity:0}

.c{position:absolute;border:0;padding:0;background:none;cursor:pointer;opacity:0;animation:pop .7s cubic-bezier(.2,1.4,.4,1) calc(1.7s + var(--i)*.13s) forwards}

.f img{width:100%;height:100%;display:block}
.f::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#fff8 50%,transparent 60%);transform:translateX(-120%);animation:sh 5s ease-in-out calc(2.5s + var(--i)*.6s) infinite}

.p{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:999px;font-weight:800;font-size:clamp(11px,3.6vw,17px);white-space:nowrap}
.b{position:absolute;left:82.520%;top:88.216%;width:14.648%;height:9.766%;border:0;background:none;padding:0;border-radius:50%}
